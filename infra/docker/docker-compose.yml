name: docvance

services:
  postgres:
    image: postgres:16-alpine
    container_name: docvance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docvance
      POSTGRES_PASSWORD: docvance
      POSTGRES_DB: docvance
    ports:
      - "5433:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docvance -d docvance"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: docvance-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  almacenamiento:
    image: minio/minio:latest
    container_name: docvance-almacenamiento
    restart: unless-stopped
    command: server /datos --console-address ":9101"
    environment:
      MINIO_ROOT_USER: docvance
      MINIO_ROOT_PASSWORD: docvance123
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - almacenamiento-datos:/datos
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  crear-balde:
    image: minio/mc:latest
    depends_on:
      almacenamiento:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://almacenamiento:9000 docvance docvance123;
      mc mb --ignore-existing local/docvance-documentos;
      mc anonymous set none local/docvance-documentos;
      exit 0;
      "

volumes:
  postgres-datos:
  redis-datos:
  almacenamiento-datos:

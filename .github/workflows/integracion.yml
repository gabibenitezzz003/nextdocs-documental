name: integracion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docvance
          POSTGRES_PASSWORD: docvance
          POSTGRES_DB: docvance
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U docvance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      POSTGRES_URL: postgresql://docvance:docvance@localhost:5433/docvance
      REDIS_URL: redis://localhost:6380

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Revisar estilo
        run: pnpm lint

      - name: Revisar tipos
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Migrar base
        run: pnpm db:migrar

      - name: Pruebas de integracion
        run: pnpm test:integracion

      - name: Compilar
        run: pnpm build
